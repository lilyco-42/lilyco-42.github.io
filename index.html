<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lilyco-42 · GitHub Dashboard</title>
  <style>
    :root {
      --bg: #0d1117;
      --bg2: #161b22;
      --bg3: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --blue: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
      --purple: #bc8cff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* ── Top Bar ── */
    #topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; background: var(--bg2);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    #topbar h1 { font-size: 1rem; font-weight: 600; }
    #token-input {
      flex: 1; max-width: 340px;
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--text); padding: 5px 10px; border-radius: 6px;
      font-size: 0.8rem; font-family: monospace;
    }
    #token-input::placeholder { color: var(--muted); }
    .btn {
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--text); padding: 5px 12px; border-radius: 6px;
      cursor: pointer; font-size: 0.8rem; transition: background .15s;
    }
    .btn:hover { background: var(--border); }
    .btn.primary { background: #1f6feb; border-color: #1f6feb; }
    .btn.primary:hover { background: #388bfd; }
    #status-bar { margin-left: auto; font-size: 0.75rem; color: var(--muted); }

    /* ── Layout ── */
    #main { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    #sidebar {
      width: 260px; flex-shrink: 0;
      background: var(--bg2); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    #sidebar-header {
      padding: 10px 12px; border-bottom: 1px solid var(--border);
      font-size: 0.8rem; color: var(--muted); display: flex;
      align-items: center; justify-content: space-between;
    }
    #repo-list { flex: 1; overflow-y: auto; }
    .repo-item {
      padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--border);
      font-size: 0.82rem; display: flex; align-items: center; gap: 8px;
      transition: background .1s;
    }
    .repo-item:hover { background: var(--bg3); }
    .repo-item.active { background: #1f6feb22; border-left: 2px solid var(--blue); }
    .repo-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .repo-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .repo-lang { font-size: 0.7rem; color: var(--muted); }

    /* ── Content ── */
    #content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* ── Tabs ── */
    #tabs {
      display: flex; border-bottom: 1px solid var(--border);
      background: var(--bg2); flex-shrink: 0;
    }
    .tab {
      padding: 8px 16px; cursor: pointer; font-size: 0.82rem;
      color: var(--muted); border-bottom: 2px solid transparent;
      transition: color .15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); border-bottom-color: var(--blue); }

    /* ── Panel ── */
    .panel { flex: 1; overflow-y: auto; padding: 16px; display: none; }
    .panel.active { display: block; }

    /* ── Cards ── */
    .card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 16px; margin-bottom: 10px;
    }
    .card-row { display: flex; align-items: center; gap: 10px; }
    .card-title { font-weight: 600; font-size: 0.9rem; }
    .card-meta { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
    .card-meta span { margin-right: 12px; }

    /* ── Status badges ── */
    .badge {
      font-size: 0.7rem; font-weight: 600; padding: 2px 8px;
      border-radius: 20px; text-transform: uppercase; flex-shrink: 0;
    }
    .s-success    { background:#1a3a2a; color:var(--green); border:1px solid var(--green); }
    .s-failure    { background:#3a1a1a; color:var(--red);   border:1px solid var(--red); }
    .s-in_progress{ background:#3a2e1a; color:var(--yellow);border:1px solid var(--yellow); animation: pulse 1.2s infinite; }
    .s-queued     { background:#3a2e1a; color:var(--yellow);border:1px solid var(--yellow); }
    .s-cancelled  { background:var(--bg3); color:var(--muted); border:1px solid var(--border); }
    .s-unknown    { background:var(--bg3); color:var(--muted); border:1px solid var(--border); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .dot-success    { background: var(--green); }
    .dot-failure    { background: var(--red); }
    .dot-in_progress{ background: var(--yellow); }
    .dot-other      { background: var(--muted); }

    /* ── Console ── */
    #console-panel {
      display: none; flex-direction: column; flex: 1; overflow: hidden;
    }
    #console-panel.active { display: flex; }
    #console-output {
      flex: 1; overflow-y: auto; padding: 12px;
      font-family: monospace; font-size: 0.8rem; line-height: 1.6;
      background: #010409;
    }
    .log-info  { color: var(--text); }
    .log-ok    { color: var(--green); }
    .log-err   { color: var(--red); }
    .log-warn  { color: var(--yellow); }
    .log-json  { color: var(--purple); }
    .log-cmd   { color: var(--blue); }
    #console-input-row {
      display: flex; border-top: 1px solid var(--border);
      background: var(--bg2); flex-shrink: 0;
    }
    #console-prompt { padding: 8px 12px; color: var(--green); font-family: monospace; font-size: 0.85rem; }
    #console-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-family: monospace; font-size: 0.85rem;
      padding: 8px 0;
    }
    #console-run { padding: 8px 14px; background: var(--bg3); border: none; border-left: 1px solid var(--border); color: var(--blue); cursor: pointer; font-size: 0.8rem; }
    #console-run:hover { background: var(--border); }

    /* ── Misc ── */
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .empty { color: var(--muted); font-size: 0.85rem; padding: 24px 0; text-align: center; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    #summary { display:flex; gap:16px; margin-bottom:14px; flex-wrap:wrap; }
    .sum-item { font-size:0.8rem; color:var(--muted); } .sum-item strong { color:var(--text); }
  </style>
</head>
<body>

<!-- Top Bar -->
<div id="topbar">
  <svg width="20" height="20" viewBox="0 0 16 16" fill="var(--text)"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
  <h1>lilyco-42 · Dashboard</h1>
  <input id="token-input" type="password" placeholder="GitHub Token (可选，提高 API 限额)" />
  <button class="btn primary" onclick="init()">加载</button>
  <button class="btn" onclick="startAutoRefresh()">↻ 自动刷新</button>
  <span id="status-bar">未加载</span>
</div>

<!-- Main -->
<div id="main">

  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">
      <span>仓库列表</span>
      <span id="repo-count" style="color:var(--text)">-</span>
    </div>
    <div id="repo-list"><div class="empty">点击「加载」开始</div></div>
  </div>

  <!-- Content -->
  <div id="content">
    <div id="tabs">
      <div class="tab active" onclick="switchTab('actions')">Actions</div>
      <div class="tab" onclick="switchTab('repos')">所有仓库</div>
      <div class="tab" onclick="switchTab('console')">JS 控制台</div>
    </div>

    <div id="actions-panel" class="panel active"><div class="empty">选择左侧仓库查看 Actions</div></div>
    <div id="repos-panel" class="panel"><div class="empty">点击「加载」获取仓库列表</div></div>
    <div id="console-panel" class="panel">
      <div id="console-output"></div>
      <div id="console-input-row">
        <span id="console-prompt">❯</span>
        <input id="console-input" placeholder="输入 JS 或 GitHub API 路径，如: /repos/lilyco-42/claw-code/actions/runs" onkeydown="handleConsoleKey(event)" />
        <button id="console-run" onclick="runConsole()">运行</button>
      </div>
    </div>
  </div>
</div>

<script>
const OWNER = 'lilyco-42';
let token = '';
let repos = [];
let autoRefreshTimer = null;
let consoleHistory = [];
let historyIdx = -1;

// ── API ──────────────────────────────────────────────────────
async function api(path) {
  const headers = { Accept: 'application/vnd.github+json' };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const url = path.startsWith('http') ? path : `https://api.github.com${path}`;
  const res = await fetch(url, { headers });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText} — ${url}`);
  return res.json();
}

// ── Init ─────────────────────────────────────────────────────
async function init() {
  token = document.getElementById('token-input').value.trim();
  setStatus('加载中...');
  try {
    const data = await api(`/users/${OWNER}/repos?per_page=100&sort=updated`);
    repos = data;
    document.getElementById('repo-count').textContent = repos.length;
    renderSidebar();
    renderReposPanel();
    setStatus(`✓ ${repos.length} 个仓库  ${new Date().toLocaleTimeString('zh-CN')}`);
  } catch(e) {
    setStatus('❌ ' + e.message);
  }
}

// ── Sidebar ──────────────────────────────────────────────────
function renderSidebar() {
  const el = document.getElementById('repo-list');
  el.innerHTML = repos.map(r => `
    <div class="repo-item" onclick="loadActions('${r.name}', this)">
      <div class="repo-dot dot-other" id="dot-${r.name}"></div>
      <span class="repo-name">${r.name}</span>
      <span class="repo-lang">${r.language || ''}</span>
    </div>
  `).join('');
}

// ── Repos Panel ──────────────────────────────────────────────
function renderReposPanel() {
  const el = document.getElementById('repos-panel');
  el.innerHTML = repos.map(r => `
    <div class="card">
      <div class="card-row">
        <div style="flex:1">
          <div class="card-title"><a href="${r.html_url}" target="_blank">${r.name}</a></div>
          <div class="card-meta">
            <span>${r.description || '无描述'}</span>
          </div>
          <div class="card-meta" style="margin-top:6px">
            <span>⭐ ${r.stargazers_count}</span>
            <span>🍴 ${r.forks_count}</span>
            <span>📦 ${r.language || 'N/A'}</span>
            <span>🕐 ${timeAgo(r.updated_at)}</span>
            ${r.private ? '<span style="color:var(--yellow)">🔒 私有</span>' : ''}
          </div>
        </div>
        <button class="btn" onclick="loadActions('${r.name}', null); switchTab('actions')">查看 Actions</button>
      </div>
    </div>
  `).join('');
}

// ── Actions Panel ────────────────────────────────────────────
let currentRepo = null;
async function loadActions(repoName, el) {
  currentRepo = repoName;
  switchTab('actions');

  // highlight sidebar
  document.querySelectorAll('.repo-item').forEach(i => i.classList.remove('active'));
  if (el) el.classList.add('active');

  const panel = document.getElementById('actions-panel');
  panel.innerHTML = `<div class="empty">加载 ${repoName} 的 Actions...</div>`;

  try {
    const data = await api(`/repos/${OWNER}/${repoName}/actions/runs?per_page=25`);
    const runs = data.workflow_runs || [];

    // update sidebar dot
    const dot = document.getElementById(`dot-${repoName}`);
    if (dot) {
      const latest = runs[0];
      if (!latest) { dot.className = 'repo-dot dot-other'; }
      else {
        const s = statusClass(latest.conclusion, latest.status);
        dot.className = `repo-dot dot-${s === 'success' ? 'success' : s === 'failure' ? 'failure' : s === 'in_progress' ? 'in_progress' : 'other'}`;
      }
    }

    if (runs.length === 0) {
      panel.innerHTML = `<div class="empty">${repoName} 暂无 Actions 运行记录</div>`;
      return;
    }

    const counts = { success:0, failure:0, in_progress:0 };
    runs.forEach(r => {
      const s = statusClass(r.conclusion, r.status);
      if (s in counts) counts[s]++;
    });

    panel.innerHTML = `
      <div id="summary">
        <div class="sum-item">📦 <strong>${repoName}</strong></div>
        <div class="sum-item">共 <strong>${runs.length}</strong> 条</div>
        <div class="sum-item" style="color:var(--green)">✅ <strong>${counts.success}</strong></div>
        <div class="sum-item" style="color:var(--red)">❌ <strong>${counts.failure}</strong></div>
        <div class="sum-item" style="color:var(--yellow)">🔄 <strong>${counts.in_progress}</strong></div>
      </div>
      ${runs.map(run => {
        const sc = statusClass(run.conclusion, run.status);
        return `
        <div class="card">
          <div class="card-row">
            <div style="flex:1">
              <div class="card-title">${run.display_title || run.name}</div>
              <div class="card-meta" style="margin-top:5px">
                <span>🔀 ${run.head_branch}</span>
                <span>⚡ ${run.event}</span>
                <span>🕐 ${timeAgo(run.created_at)}</span>
                <span style="color:var(--muted)">#${run.run_number}</span>
              </div>
            </div>
            <span class="badge s-${sc}">${statusLabel(run.conclusion, run.status)}</span>
            <a href="${run.html_url}" target="_blank" style="margin-left:10px;font-size:0.8rem">查看 →</a>
          </div>
        </div>`;
      }).join('')}
    `;
  } catch(e) {
    panel.innerHTML = `<div class="empty" style="color:var(--red)">${e.message}</div>`;
  }
}

// ── Console ──────────────────────────────────────────────────
function log(msg, cls='log-info') {
  const out = document.getElementById('console-output');
  const line = document.createElement('div');
  line.className = cls;
  line.textContent = msg;
  out.appendChild(line);
  out.scrollTop = out.scrollHeight;
}

function logJson(obj) {
  const out = document.getElementById('console-output');
  const pre = document.createElement('pre');
  pre.className = 'log-json';
  pre.style.cssText = 'white-space:pre-wrap;word-break:break-all;margin:2px 0';
  pre.textContent = JSON.stringify(obj, null, 2);
  out.appendChild(pre);
  out.scrollTop = out.scrollHeight;
}

async function runConsole() {
  const input = document.getElementById('console-input');
  const cmd = input.value.trim();
  if (!cmd) return;

  consoleHistory.unshift(cmd);
  historyIdx = -1;
  input.value = '';

  log(`❯ ${cmd}`, 'log-cmd');

  // API path shortcut
  if (cmd.startsWith('/')) {
    try {
      const data = await api(cmd);
      logJson(data);
    } catch(e) { log('Error: ' + e.message, 'log-err'); }
    return;
  }

  // JS eval
  try {
    // expose helpers
    const result = await eval(`(async () => { ${cmd} })()`);
    if (result !== undefined) logJson(result);
  } catch(e) {
    log('Error: ' + e.message, 'log-err');
  }
}

function handleConsoleKey(e) {
  if (e.key === 'Enter') { runConsole(); return; }
  if (e.key === 'ArrowUp') {
    historyIdx = Math.min(historyIdx + 1, consoleHistory.length - 1);
    e.target.value = consoleHistory[historyIdx] || '';
  }
  if (e.key === 'ArrowDown') {
    historyIdx = Math.max(historyIdx - 1, -1);
    e.target.value = historyIdx >= 0 ? consoleHistory[historyIdx] : '';
  }
}

// ── Tabs ─────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    const names = ['actions','repos','console'];
    t.classList.toggle('active', names[i] === name);
  });
  ['actions-panel','repos-panel','console-panel'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.toggle('active', id === `${name}-panel`);
    if (id === 'console-panel') el.style.display = name === 'console' ? 'flex' : 'none';
    else el.style.display = id === `${name}-panel` ? 'block' : 'none';
  });
}

// ── Auto Refresh ─────────────────────────────────────────────
function startAutoRefresh() {
  if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; setStatus('自动刷新已停止'); return; }
  autoRefreshTimer = setInterval(() => {
    init();
    if (currentRepo) loadActions(currentRepo, null);
  }, 30000);
  setStatus('自动刷新已开启（30s）');
}

// ── Helpers ──────────────────────────────────────────────────
function statusClass(conclusion, status) {
  if (status === 'in_progress' || status === 'queued') return status;
  return conclusion || 'unknown';
}
function statusLabel(conclusion, status) {
  if (status === 'in_progress') return 'Running';
  if (status === 'queued') return 'Queued';
  return { success:'成功', failure:'失败', cancelled:'取消', skipped:'跳过' }[conclusion] || conclusion || '未知';
}
function timeAgo(d) {
  const s = Math.floor((Date.now() - new Date(d)) / 1000);
  if (s < 60) return `${s}秒前`;
  if (s < 3600) return `${Math.floor(s/60)}分钟前`;
  if (s < 86400) return `${Math.floor(s/3600)}小时前`;
  return `${Math.floor(s/86400)}天前`;
}
function setStatus(msg) { document.getElementById('status-bar').textContent = msg; }

// ── Console welcome ──────────────────────────────────────────
log('GitHub Dashboard — lilyco-42', 'log-ok');
log('快捷用法：', 'log-info');
log('  /repos/lilyco-42/claw-code/actions/runs   → 查看 Actions', 'log-info');
log('  /user/repos?per_page=100                  → 查看所有仓库', 'log-info');
log('  await api("/repos/lilyco-42/claw-code")   → 调用 API', 'log-info');
log('  repos                                     → 当前仓库列表', 'log-info');
log('', 'log-info');

// 自动加载
init();
</script>
</body>
</html>
