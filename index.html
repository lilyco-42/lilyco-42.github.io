.nav-item.on { background:var(--card); color:var(--fg); }

.side-repos { flex:1; overflow-y:auto; margin-top:.3rem; }
.side-repo { padding:.45rem .7rem; border-radius:8px; font-size:.8rem; color:var(--dim); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.side-foot { border-top:1px solid var(--edge); padding-top:.7rem; font-size:.75rem; }

.burger { display:none; }

.main { flex:1; overflow-y:auto; padding:2rem 2.4rem 3rem; }

.dot { width:.6rem; height:.6rem; border-radius:50%; display:inline-block; margin-right:.25rem; }
.langs { display:flex; gap:.4rem; flex-wrap:wrap; margin:.6rem 0 1rem; }
.lang { border:1px solid var(--edge); color:var(--dim); background:transparent; border-radius:16px; padding:.18rem .7rem; font-size:.74rem; cursor:pointer; }
.lang.on { border-color:var(--acc); color:var(--acc); }
.empty { color:var(--dim); padding:1rem; font-size:.85rem; }
footer { color:var(--dim); font-size:.76rem; margin-top:2rem; line-height:1.7; border-top:1px solid var(--edge); padding-top:1rem; }

@media (max-width: 860px) {
  .sidebar { position:fixed; left:0; top:0; bottom:0; z-index:10; transform:translateX(-100%); transition:transform .2s; }
  .sidebar.open { transform:translateX(0); }
  .burger-btn { display:block; }
  .main { padding:1.2rem 1.1rem 2rem; }
}
</style>

  try {
    for (let page = 1; page <= 10; page++) {
      const r = await fetch("https://api.github.com/users/" + OWNER + "/repos?per_page=100&sort=pushed&page=" + page, { headers: headers });
      const batch = await r.json();
      if (!Array.isArray(batch) || batch.length === 0) break;
      REPOS = REPOS.concat(batch);
      if (batch.length < 100) break;
    }
  } catch (e) { /* 网络失败：保留已取到的部分，不要清空 */ }
  const langs = new Set();
  REPOS.forEach(function (r) { if (r.language) langs.add(r.language); });
  document.getElementById("langs").innerHTML =
    '<button class="lang on" data-l="">全部</button>' +
    Array.from(langs).sort().map(function (l) { return '<button class="lang" data-l="' + l + '">' + l + '</button>'; }).join("");
  document.querySelectorAll("#langs .lang").forEach(function (el) {
    el.addEventListener("click", function () {
      document.querySelectorAll("#langs .lang").forEach(function (x) { x.classList.remove("on"); });
      el.classList.add("on"); LANG = el.dataset.l; renderRepos();
    });
  });
  renderRepos();
  renderSideGuides();
}

function renderRepos() {
  const grid = document.getElementById("repos");
  const items = REPOS.filter(function (r) {
    if (r.fork) return false;
    if (LANG && r.language !== LANG) return false;
    if (Q && (r.name + " " + (r.description || "")).toLowerCase().indexOf(Q) < 0) return false;
    return true;
  });
  if (document.getElementById("v-repos").classList.contains("on")) {
    document.getElementById("view-title").textContent = "全部仓库 · " + items.length + " 个";
  }
  if (!items.length) { grid.innerHTML = '<div class="empty">无匹配仓库</div>'; return; }
  grid.innerHTML = items.map(function (r) {
    const c = LANGC[r.language] || "#8b949e";
    return '<div class="rcard"><h3><a href="' + r.html_url + '" target="_blank">' + r.name + '</a></h3>' +
      '<p>' + (r.description || "（无描述）") + '</p>' +
      '<div class="meta"><span><span class="dot" style="background:' + c + '"></span>' + (r.language || "-") + '</span>' +
      '<span>★ ' + r.stargazers_count + '</span><span>push ' + (r.pushed_at || "").slice(0, 10) + '</span></div></div>';
  }).join("");
}

function renderSideGuides() {
  document.getElementById("side-guides").innerHTML = Object.keys(FEATURED.reduce(function (o, f) {
    o[f.name] = 1; return o;
  }, {})).map(function (n) {
    return '<div class="side-repo" onclick="location=\'guide.html?name=' + n + '\'">' + n + '</div>';
  }).join("");
}

document.querySelectorAll(".nav-item").forEach(function (el) {
  el.addEventListener("click", function () { switchView(el.dataset.view); });
});
document.getElementById("burger").addEventListener("click", function () {
  document.getElementById("sidebar").classList.toggle("open");
});
document.getElementById("q").addEventListener("input", function (e) {
  Q = e.target.value.toLowerCase();
  switchView("repos");
  renderRepos();
});

renderFeatured();
renderApps();
renderResearch();
loadRepos();
</script>
</body>
</html>
