<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rembg Studio · UI Preview</title><meta name="description" content="Rembg Studio 新版 UI 在线预览（静态展示，不执行 AI 推理）"><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#080d19;color:#ecf2fc}*{box-sizing:border-box}body{margin:0}.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}aside{border-right:1px solid #253248;background:#0c1525;padding:28px 18px}aside h2{font-size:20px;margin:4px 0 32px}.mark{color:#53c8f5}.muted{color:#94a5bd}.nav{display:block;width:100%;text-align:left;margin-bottom:10px;background:transparent;color:#aebdd1;border:1px solid transparent;padding:12px 14px;border-radius:10px;cursor:pointer;font:inherit}.nav.active,.nav:hover{background:#18314a;color:#d8f3ff;border-color:#285677}main{max-width:1300px;width:100%;padding:40px clamp(18px,5vw,64px);margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.eyebrow{font-size:12px;font-weight:800;color:#60c9f2;letter-spacing:.2em}h1{font-size:clamp(28px,4vw,42px);margin:12px 0}p{line-height:1.7}.card{border:1px solid #283951;background:#101b2d;border-radius:16px;padding:22px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;margin-top:28px}.drop{height:380px;border:2px dashed #3a5973;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;cursor:pointer;background:repeating-conic-gradient(#172338 0% 25%,#1d2b41 0% 50%) 50%/32px 32px;overflow:hidden}.drop img{max-width:100%;max-height:100%;object-fit:contain}.drop strong{font-size:22px}.btn,select{font:inherit;border-radius:10px;padding:11px 14px;border:1px solid #344863;background:#16253b;color:#eff6ff;cursor:pointer}.primary{background:#48b9ea;border:0;color:#061421;font-weight:750;width:100%}.btn:disabled{opacity:.55;cursor:not-allowed}label{display:block;font-size:13px;font-weight:700;margin:15px 0 8px}select{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{border-radius:40px;background:#153c35;color:#71dfae;font-size:12px;padding:5px 9px}.stack{display:grid;gap:15px}.models{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:26px}.models h3{margin:10px 0 4px}.models p{font-size:13px;margin:0 0 18px}.notice{margin-top:28px;border:1px solid #69512b;background:#302718;color:#f3ce7e;padding:13px 17px;border-radius:12px;font-size:13px}input[type=file]{display:none}#fileName{font-size:12px;margin-top:12px;overflow-wrap:anywhere}button:focus-visible,.drop:focus-visible{outline:2px solid #7de5ff;outline-offset:3px}[hidden]{display:none!important}@media(max-width:950px){.workspace{grid-template-columns:1fr}.models{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:680px){.layout{display:block}aside{display:flex;align-items:center;gap:12px;padding:14px;overflow:auto}aside h2{font-size:15px;white-space:nowrap;margin:0 8px 0 0}.nav{white-space:nowrap;width:auto;margin:0;padding:9px}main{padding:24px 15px}.models{grid-template-columns:1fr}.drop{height:290px}}
</style></head><body><div class="layout"><aside><h2><span class="mark">✦</span> Rembg Studio</h2><button class="nav active" data-page="editor" id="navEditor">✂ 抠图工作台</button><button class="nav" data-page="models" id="navModels">▦ 模型中心</button><a class="nav" href="https://github.com/lilyco-42/rembg-ui" target="_blank" rel="noopener">⌁ GitHub 源码</a></aside><main><header class="top"><div><div class="eyebrow">REMBG STUDIO · DESIGN PREVIEW</div><h1 id="heading">智能抠图工作台</h1><p class="muted" id="subtitle">新的商业级工作台设计 · shadcn/ui 风格</p></div><select id="lang" aria-label="Language" style="width:auto"><option value="zh">简体中文</option><option value="en">English</option></select></header><section id="editor"><div class="workspace"><div class="card"><div class="row"><strong id="previewTitle">图片预览</strong><span class="pill" id="demoBadge">交互演示</span></div><div class="drop" id="drop" role="button" tabindex="0"><div id="placeholder"><div style="font-size:48px;color:#65c6ee">☁</div><strong id="dropTitle">拖放图片到此处</strong><p class="muted" id="dropSubtitle">或点击选择图片 · PNG / JPEG / WebP</p></div><img id="preview" alt="上传图片预览" hidden></div><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><p class="muted" id="fileName"></p></div><div class="card"><h3 id="settings">处理设置</h3><label id="modelLabel">AI 抠图模型</label><select id="model"><option>U2Netp · Fast</option><option>U2Net · General</option><option>ISNet Anime</option><option>BRIA RMBG · License required</option></select><label id="outputLabel">输出格式</label><select><option>Transparent PNG</option></select><div style="height:24px"></div><button class="btn primary" id="run">✦ 一键抠图（演示）</button><p class="muted" style="font-size:13px" id="runMessage">这里展示 UI，不调用 AI 模型。</p><button class="btn" id="clear" style="width:100%" >重置图片</button></div></div></section><section id="models" hidden><div class="models" id="modelsGrid"></div></section><div class="notice" id="notice">⚠ 此页面是静态 UI 预览，可上传本地图片查看布局；不会上传图片到服务器，也不会进行真实 AI 抠图。实际运行请下载 Rembg Studio。</div></main></div><script>
const text={zh:{editor:'智能抠图工作台',models:'模型中心',subtitle:'新的商业级工作台设计 · shadcn/ui 风格',preview:'图片预览',badge:'交互演示',drop:'拖放图片到此处',choose:'或点击选择图片 · PNG / JPEG / WebP',settings:'处理设置',model:'AI 抠图模型',output:'输出格式',run:'✦ 一键抠图（演示）',runMessage:'这里展示 UI，不调用 AI 模型。',clear:'重置图片',notice:'⚠ 此页面是静态 UI 预览，可上传本地图片查看布局；不会上传图片到服务器，也不会进行真实 AI 抠图。实际运行请下载 Rembg Studio。',ready:'可选择',install:'模型管理预览',msg:'演示模式：没有调用抠图引擎。'},en:{editor:'Background Removal Studio',models:'Model Library',subtitle:'A modern commercial UI concept · shadcn-inspired',preview:'Image Preview',badge:'UI Demo',drop:'Drop an image here',choose:'or click to choose · PNG / JPEG / WebP',settings:'Processing Settings',model:'AI Model',output:'Output Format',run:'✦ Remove Background (Demo)',runMessage:'UI showcase only. No AI inference is performed.',clear:'Reset image',notice:'⚠ Static UI preview. You can preview a local image, but nothing is uploaded to a server and no AI inference runs. Download Rembg Studio for actual processing.',ready:'Available',install:'Model preview',msg:'Demo mode: no inference was performed.'}};
const modelData=[['U2Netp','Fast general-purpose'],['U2Net','Standard background removal'],['ISNet Anime','Anime and illustration'],['ISNet General','Detailed segmentation'],['Silueta','Lightweight model'],['BRIA RMBG','Commercial license required']];
let lang='zh',page='editor',objectURL=null;
function render(){const t=text[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.getElementById('heading').textContent=t[page];document.getElementById('subtitle').textContent=t.subtitle;document.getElementById('previewTitle').textContent=t.preview;document.getElementById('demoBadge').textContent=t.badge;document.getElementById('dropTitle').textContent=t.drop;document.getElementById('dropSubtitle').textContent=t.choose;document.getElementById('settings').textContent=t.settings;document.getElementById('modelLabel').textContent=t.model;document.getElementById('outputLabel').textContent=t.output;document.getElementById('run').textContent=t.run;document.getElementById('runMessage').textContent=t.runMessage;document.getElementById('clear').textContent=t.clear;document.getElementById('notice').textContent=t.notice;document.getElementById('navEditor').textContent='✂ '+t.editor;document.getElementById('navModels').textContent='▦ '+t.models;document.getElementById('modelsGrid').replaceChildren(...modelData.map(([name,desc])=>{const card=document.createElement('article');card.className='card';const badge=document.createElement('span');badge.className='pill';badge.textContent=t.ready;const h=document.createElement('h3');h.textContent=name;const p=document.createElement('p');p.className='muted';p.textContent=desc;const b=document.createElement('button');b.className='btn';b.style.width='100%';b.textContent=t.install;b.onclick=()=>{page='editor';navigate()};card.append(badge,h,p,b);return card}));navigate()}
function navigate(){document.getElementById('editor').hidden=page!=='editor';document.getElementById('models').hidden=page!=='models';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('heading').textContent=text[lang][page]}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;render()}));
document.getElementById('lang').onchange=e=>{lang=e.target.value;render()};
const upload=document.getElementById('file'),preview=document.getElementById('preview'),placeholder=document.getElementById('placeholder');
function selected(f){if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>20*1024*1024){alert('PNG/JPEG/WebP, 20 MB max');return}if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(f);preview.src=objectURL;preview.hidden=false;placeholder.hidden=true;document.getElementById('fileName').textContent=f.name}
document.getElementById('drop').onclick=()=>upload.click();document.getElementById('drop').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();upload.click()}};document.getElementById('drop').ondragover=e=>e.preventDefault();document.getElementById('drop').ondrop=e=>{e.preventDefault();selected(e.dataTransfer.files[0])};upload.onchange=e=>selected(e.target.files[0]);document.getElementById('clear').onclick=()=>{if(objectURL)URL.revokeObjectURL(objectURL);objectURL=null;preview.hidden=true;preview.removeAttribute('src');placeholder.hidden=false;upload.value='';document.getElementById('fileName').textContent=''};document.getElementById('run').onclick=()=>{document.getElementById('runMessage').textContent=text[lang].msg};render();
</script></body></html>
