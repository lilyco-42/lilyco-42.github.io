<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lyco sheet — WASM 公式引擎</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--fg:#c9d1d9;--dim:#8b949e;--acc:#58a6ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:ui-monospace,Cascadia Code,monospace;padding:30px 16px}
.wrap{max-width:960px;margin:0 auto}
h1{font-size:20px}.sub{color:var(--dim);font-size:12px;margin:6px 0 18px}
table{border-collapse:collapse;width:100%}
th{background:#1c2128;color:var(--dim);font-size:11px;padding:4px;border:1px solid #30363d}
td{border:1px solid #30363d;padding:0}
input{width:100%;background:transparent;border:0;color:var(--fg);font:inherit;font-size:12px;padding:5px 6px}
input.num{text-align:right;color:#7ee787}
input.f{color:var(--acc)}
.err{color:#f85149!important}
.card{background:var(--card);border:1px solid #30363d;border-radius:10px;padding:14px 16px;margin-bottom:14px}
.stat{color:var(--dim);font-size:12px;margin-top:8px}
a{color:var(--acc);text-decoration:none}
button{background:var(--acc);border:0;color:#000;font:inherit;font-weight:600;padding:5px 12px;border-radius:6px;cursor:pointer}
</style></head>
<body>
<div class="wrap">
  <h1>lyco sheet <span style="color:var(--dim);font-size:12px">sheet.wasm 11KB · 递归下降公式引擎在 WASM 内</span></h1>
  <div class="sub">支持 =1+2*3 (A1) =SUM/AVG/MIN/MAX/COUNT(范围) 括号 负号 · <a href="../">← lyco 工具箱</a></div>
  <div class="card">
    <button onclick="demo()">填入示例</button> <button onclick="recalc()">全部重算</button>
    <div class="stat" id="st">点击单元格输入,以 = 开头即公式</div>
  </div>
  <table id="tb"></table>
</div>
<script>
const COLS = 12, ROWS = 20;
const raw = {};   // "r,c" -> 用户输入
const val = {};   // "r,c" -> 数值
let e, depth = 0;

(async () => {
  const { instance } = await WebAssembly.instantiateStreaming(fetch('sheet.wasm'), {
    env: { cellget: (r, c) => {
      if (depth > 64) return 0;
      const v = val[r + ',' + c];
      return typeof v === 'number' ? v : 0;
    }}
  });
  e = instance.exports;
  const tb = document.getElementById('tb');
  let h = '<tr><th></th>';
  for (let c = 0; c < COLS; c++) h += `<th>${String.fromCharCode(65 + c)}</th>`;
  h += '</tr>';
  for (let r = 0; r < ROWS; r++) {
    h += `<tr><th>${r + 1}</th>`;
    for (let c = 0; c < COLS; c++)
      h += `<td><input id="i${r}_${c}" onfocus="focusCell(${r},${c})" onblur="blurCell(${r},${c})" onkeydown="if(event.key==='Enter')this.blur()"></td>`;
    h += '</tr>';
  }
  tb.innerHTML = h;
  demo();
})();

function focusCell(r, c) {
  const k = r + ',' + c, el = document.getElementById(`i${r}_${c}`);
  el.value = raw[k] ?? ''; el.classList.remove('num');
}
function blurCell(r, c) {
  const k = r + ',' + c, el = document.getElementById(`i${r}_${c}`);
  raw[k] = el.value; recalc();
}
function recalc() {
  depth = 0;
  for (let pass = 0; pass < 3; pass++) {
    for (const k in raw) {
      const [r, c] = k.split(',').map(Number), s = raw[k];
      if (s && s.startsWith('=')) {
        const b = new TextEncoder().encode(s.slice(1));
        new Uint8Array(e.memory.buffer, e.fbuf(), b.length).set(b);
        e.fset(b.length);
        depth++; val[k] = e.evaluate(); depth--;
        if (e.lasterr() === 4) val[k] = NaN;           // DIV/0
        else if (e.lasterr()) val[k] = NaN;            // 语法错
      } else if (s && s.trim() !== '' && !isNaN(+s)) val[k] = +s;
      else if (s) val[k] = NaN;
      else delete val[k];
    }
  }
  for (const k in raw) {
    const [r, c] = k.split(',').map(Number), el = document.getElementById(`i${r}_${c}`);
    const s = raw[k], v = val[k];
    if (s && s.startsWith('=')) {
      el.value = isNaN(v) ? (e.lasterr() === 4 && v !== v && false ? '#DIV/0!' : '#ERR') :
        (Math.round(v * 1e10) / 1e10).toString();
      el.classList.add(s.startsWith('=') ? 'f' : 'num');
      el.classList.toggle('err', isNaN(v));
    } else { el.value = s; el.classList.toggle('num', !isNaN(+s) && s.trim() !== ''); el.classList.remove('err'); }
  }
}
function demo() {
  const d = { '0,1': '120', '0,2': '85', '0,3': '200', '1,1': '90', '1,2': '110', '1,3': '60',
    '3,0': '合计', '3,1': '=SUM(B1:C2)', '3,2': '=AVG(B1:C2)', '3,3': '=MAX(B1:C2)',
    '5,0': '表达式', '5,1': '=(B1+C1)/(B2-B1)*10' };
  for (const k in d) raw[k] = d[k];
  recalc();
  document.getElementById('st').textContent = '示例已填入 — 点任意绿色单元格查看公式,改数字自动重算';
}
</script>
</body></html>
